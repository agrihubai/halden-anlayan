name: Veriyi guncelle

on:
  schedule:
    - cron: "17 5 * * *"   # Her gün 05:17 UTC (Madrid ~06:17/07:17)
  workflow_dispatch:        # Elle çalıştırma düğmesi

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Veriyi çek
        run: scripts/build_data.py

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Otomatik veri güncellemesi"
          git push
