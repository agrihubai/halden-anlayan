name: Hal verisini güncelle

on:
  schedule:
    - cron: "23 5 * * 1,4"   # pazartesi ve perşembe 05:23 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/veri-guncelle.yml"]

permissions:
  contents: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kaynaklardan indir
        run: python scripts/update_data.py
      - name: Ürün dosyalarını üret
        run: python scripts/build_data.py
      - name: Değiştiyse kaydet
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git config user.name "agrihubai-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Hal verisi güncellendi"
            git pull --rebase
            git push
          fi
