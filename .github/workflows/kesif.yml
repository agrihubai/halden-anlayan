name: Keşif (elle)

on:
  workflow_dispatch:
    inputs:
      betik:
        description: ".github/kesif altındaki betik"
        default: "ilce.py"

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keşif betiği
        run: python .github/kesif/${{ inputs.betik }}
